<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders | Coming Soon</title>
    <style>
        :root {
            --bg-1: #03040a;
            --bg-2: #0d1023;
            --card: rgba(8, 12, 27, 0.82);
            --line: rgba(93, 238, 255, 0.18);
            --cyan: #5deeff;
            --green: #8bff6a;
            --pink: #ff4dd2;
            --text: #f3f8ff;
            --muted: #b2c4dd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100svh;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: var(--text);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 18% 25%, rgba(93, 238, 255, 0.12), transparent 30%),
                radial-gradient(circle at 82% 75%, rgba(255, 77, 210, 0.1), transparent 35%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2) 70%);
            padding: 24px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(2px 2px at 12% 14%, rgba(255, 255, 255, 0.95), transparent),
                radial-gradient(2px 2px at 32% 88%, rgba(255, 255, 255, 0.9), transparent),
                radial-gradient(2px 2px at 72% 20%, rgba(255, 255, 255, 0.88), transparent),
                radial-gradient(2px 2px at 91% 56%, rgba(255, 255, 255, 0.9), transparent),
                radial-gradient(1px 1px at 27% 63%, rgba(255, 255, 255, 0.85), transparent),
                radial-gradient(1px 1px at 64% 41%, rgba(255, 255, 255, 0.75), transparent),
                radial-gradient(1px 1px at 84% 12%, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(1px 1px at 4% 76%, rgba(255, 255, 255, 0.85), transparent);
            animation: drift 14s linear infinite;
            opacity: 0.85;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.02) 0 1px,
                    transparent 1px 4px);
            mix-blend-mode: screen;
            opacity: 0.5;
        }

        .card {
            width: min(760px, 100%);
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--card);
            backdrop-filter: blur(8px);
            box-shadow:
                0 24px 65px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            text-align: center;
            padding: clamp(28px, 4vw, 54px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, transparent, rgba(93, 238, 255, 0.08), transparent),
                linear-gradient(transparent 96%, rgba(93, 238, 255, 0.14));
            background-size: 200% 100%, 100% 18px;
            animation: sweep 4.8s linear infinite;
            pointer-events: none;
        }

        .invader {
            width: clamp(56px, 9vw, 78px);
            height: auto;
            margin: 0 auto 18px;
            display: block;
            filter: drop-shadow(0 0 10px rgba(139, 255, 106, 0.8));
            animation: bob 2.2s ease-in-out infinite;
        }

        .tag {
            display: inline-block;
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--cyan);
            border: 1px solid rgba(93, 238, 255, 0.5);
            border-radius: 999px;
            padding: 7px 14px;
            margin-bottom: 16px;
            background: rgba(93, 238, 255, 0.08);
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.7rem);
            line-height: 1;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow:
                0 0 10px rgba(93, 238, 255, 0.45),
                0 0 22px rgba(255, 77, 210, 0.3);
            margin-bottom: 12px;
        }

        h2 {
            font-size: clamp(1.2rem, 2.8vw, 1.8rem);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 18px;
            text-shadow: 0 0 12px rgba(139, 255, 106, 0.4);
        }

        p {
            max-width: 38ch;
            margin: 0 auto;
            color: var(--muted);
            font-size: clamp(0.95rem, 2.2vw, 1.1rem);
            line-height: 1.6;
        }

        .working {
            margin-top: 20px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.03em;
        }

        .glow-line {
            width: min(380px, 82%);
            height: 7px;
            margin: 24px auto 0;
            border-radius: 999px;
            background:
                linear-gradient(to right, transparent, var(--pink), var(--cyan), var(--green), transparent);
            box-shadow: 0 0 14px rgba(93, 238, 255, 0.45);
            animation: pulse 2.6s ease-in-out infinite;
        }

        @keyframes drift {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(10px);
            }
        }

        @keyframes sweep {
            0% {
                background-position: 200% 0, 0 0;
            }

            100% {
                background-position: -200% 0, 0 0;
            }
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.45;
                transform: scaleX(0.95);
            }

            50% {
                opacity: 1;
                transform: scaleX(1.03);
            }
        }
    </style>
</head>
