<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess The Number - Hard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #f43f5e;
        --accent-soft: #fb7185;
        --accent-glow: rgba(244,63,94,0.35);
        --bg-1: #071425;
        --bg-2: #102742;
        --panel: rgba(9, 20, 36, 0.78);
        --line: rgba(255, 255, 255, 0.18);
        --text: #f8fafc;
        --muted: #dbe8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: clamp(1rem, 2vw, 2rem);
        display: grid;
        place-items: center;
        color: var(--text);
        font-family: "Space Grotesk", sans-serif;
        background:
          radial-gradient(circle at 20% 15%, var(--accent-glow), transparent 45%),
          radial-gradient(circle at 85% 90%, rgba(56, 189, 248, 0.22), transparent 35%),
          linear-gradient(150deg, var(--bg-1), var(--bg-2));
      }

      .card {
        width: min(720px, 100%);
        border: 1px solid var(--line);
        border-radius: 1.4rem;
        overflow: hidden;
        background: var(--panel);
        box-shadow:
          0 26px 70px rgba(2, 6, 23, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
      }

      .top {
        padding: clamp(1rem, 3vw, 1.8rem);
        border-bottom: 1px solid var(--line);
        display: grid;
        gap: 0.6rem;
      }

      .pill {
        width: fit-content;
        border: 1px solid color-mix(in srgb, var(--accent) 45%, white 20%);
        background: color-mix(in srgb, var(--accent) 20%, transparent);
        border-radius: 999px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.32rem 0.72rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-family: "Sora", sans-serif;
        font-size: clamp(1.7rem, 4vw, 2.4rem);
      }

      .lead {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.9rem;
        padding: 1rem 1rem 0;
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: 0.9rem;
        padding: 0.85rem;
        background: rgba(255, 255, 255, 0.04);
      }

      .stat span {
        display: block;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.9;
      }

      .stat strong {
        display: block;
        margin-top: 0.35rem;
        font-size: 1.12rem;
      }

      .meter {
        margin: 1rem;
        height: 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      #meter-fill {
        height: 100%;
        width: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-soft));
        transition: width 0.25s ease;
      }

      .feedback {
        margin: 0 1rem;
        padding: 0.95rem;
        border-radius: 0.9rem;
        border: 1px solid var(--line);
        font-weight: 600;
        background: rgba(255, 255, 255, 0.05);
      }

      .feedback.info { color: var(--muted); }
      .feedback.warn { color: #fde68a; }
      .feedback.good { color: #86efac; }
      .feedback.bad { color: #fecaca; }

      .controls {
        padding: 1rem;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.8rem;
      }

      input {
        height: 54px;
        border-radius: 0.9rem;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        font-size: 1.2rem;
        font-weight: 700;
        text-align: center;
        padding: 0 0.8rem;
        outline: none;
      }

      input:focus {
        border-color: var(--accent-soft);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-soft) 22%, transparent);
      }

      button {
        min-width: 160px;
        height: 54px;
        border: none;
        border-radius: 0.9rem;
        padding: 0 1rem;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.03em;
        color: #04111f;
        background: linear-gradient(135deg, var(--accent-soft), var(--accent));
        cursor: pointer;
        transition: transform 0.18s ease, filter 0.18s ease;
      }

      button:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .footer {
        border-top: 1px solid var(--line);
        margin-top: 0.3rem;
        padding: 0.8rem 1rem 1rem;
      }

      .footer a {
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px dashed rgba(219, 232, 255, 0.45);
      }

      .footer a:hover {
        color: #ffffff;
      }

      @media (max-width: 620px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .controls {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="top">
        <span class="pill">Hard Mode</span>
        <h1>Guess The Number</h1>
        <p class="lead">Find the hidden number between 1 and 100.</p>
      </section>

      <section class="grid">
        <div class="stat">
          <span>Range</span>
          <strong id="range">1 to 100</strong>
        </div>
        <div class="stat">
          <span>Chances Left</span>
          <strong><span id="chances">20</span> / 20</strong>
        </div>
      </section>

      <div class="meter" aria-hidden="true">
        <div id="meter-fill"></div>
      </div>

      <p id="feedback" class="feedback info">Take your first guess.</p>

      <section class="controls">
        <input id="guess-input" type="number" min="1" max="100" placeholder="Type a number" />
        <button id="check-btn" type="button">Check</button>
      </section>

      <section class="footer">
        <a href="../guess the num.html">Back to levels</a>
      </section>
    </main>

    <script>
      const config = {
        min: 1,
        max: 100,
        chances: 20,
      };

      const input = document.getElementById("guess-input");
      const feedback = document.getElementById("feedback");
      const button = document.getElementById("check-btn");
      const chancesEl = document.getElementById("chances");
      const rangeEl = document.getElementById("range");
      const meterFill = document.getElementById("meter-fill");

      let target = 0;
      let remaining = config.chances;
      let finished = false;

      function pickNumber() {
        return Math.floor(Math.random() * (config.max - config.min + 1)) + config.min;
      }

      function setFeedback(message, state) {
        feedback.textContent = message;
        feedback.className = "feedback " + state;
      }

      function updateUi() {
        chancesEl.textContent = remaining;
        rangeEl.textContent = config.min + " to " + config.max;
        const pct = Math.max(0, (remaining / config.chances) * 100);
        meterFill.style.width = pct + "%";
      }

      function resetGame() {
        target = pickNumber();
        remaining = config.chances;
        finished = false;
        input.value = "";
        input.disabled = false;
        button.textContent = "Check";
        setFeedback("Take your first guess.", "info");
        updateUi();
        input.focus();
      }

      function handleTurn() {
        if (finished) {
          resetGame();
          return;
        }

        const value = Number(input.value);

        if (!Number.isInteger(value) || value < config.min || value > config.max) {
          setFeedback(
            "Enter a whole number between " + config.min + " and " + config.max + ".",
            "bad"
          );
          input.focus();
          return;
        }

        if (value === target) {
          finished = true;
          setFeedback("Perfect. " + value + " is correct.", "good");
          button.textContent = "Play Again";
          input.disabled = true;
          return;
        }

        remaining -= 1;
        updateUi();

        if (remaining <= 0) {
          finished = true;
          setFeedback("Out of chances. The number was " + target + ".", "bad");
          button.textContent = "Play Again";
          input.disabled = true;
          return;
        }

        if (value > target) {
          setFeedback("Too high. Try lower.", "warn");
        } else {
          setFeedback("Too low. Try higher.", "warn");
        }

        input.select();
        input.focus();
      }

      button.addEventListener("click", handleTurn);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          handleTurn();
        }
      });

      resetGame();
    </script>
  </body>
</html>
