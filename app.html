    </div>

    <div class="toast-w" id="tW"></div>
    <div class="mo" id="mO">
        <div class="modal">
            <div class="m-hd">
                <div class="m-title" id="mT"></div><button class="m-x" id="mX"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="m-body" id="mB"></div>
            <div class="m-ft" id="mF"></div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // ===== LOCAL DICTIONARY (60+ entries) =====
            // Dictionary removal in progress...
            const D = {};


            // PHRASEBOOK
            const PH = {
                '👋 Greetings': [{ bn: 'নমস্কার', en: 'Hello' }, { bn: 'কেমন আছেন?', en: 'How are you?' }, { bn: 'আমি ভালো আছি', en: 'I am fine' }, { bn: 'শুভ সকাল', en: 'Good morning' }, { bn: 'শুভ রাত্রি', en: 'Good night' }, { bn: 'আবার দেখা হবে', en: 'See you again' }, { bn: 'বিদায়', en: 'Goodbye' }],
                '🍽️ Food & Drink': [{ bn: 'আমি ক্ষুধার্ত', en: 'I am hungry' }, { bn: 'আমি তৃষ্ণার্ত', en: 'I am thirsty' }, { bn: 'খাবার সুস্বাদু', en: 'Food is delicious' }, { bn: 'চা দিন', en: 'Give me tea' }, { bn: 'ভাত', en: 'Rice' }, { bn: 'মাছ', en: 'Fish' }, { bn: 'মিষ্টি', en: 'Sweet' }],
                '🗺️ Travel': [{ bn: 'এটা কোথায়?', en: 'Where is this?' }, { bn: 'কত দূর?', en: 'How far?' }, { bn: 'আমি হারিয়ে গেছি', en: 'I am lost' }, { bn: 'ডানে যান', en: 'Go right' }, { bn: 'বামে যান', en: 'Go left' }, { bn: 'কত টাকা?', en: 'How much?' }],
                '❤️ Feelings': [{ bn: 'আমি খুশি', en: 'I am happy' }, { bn: 'আমি দুঃখিত', en: 'I am sorry' }, { bn: 'আমি ভালোবাসি', en: 'I love' }, { bn: 'আমি ভয় পাচ্ছি', en: 'I am afraid' }, { bn: 'আমি ক্লান্ত', en: 'I am tired' }],
                '📅 Days': [{ bn: 'সোমবার', en: 'Monday' }, { bn: 'মঙ্গলবার', en: 'Tuesday' }, { bn: 'বুধবার', en: 'Wednesday' }, { bn: 'বৃহস্পতিবার', en: 'Thursday' }, { bn: 'শুক্রবার', en: 'Friday' }, { bn: 'শনিবার', en: 'Saturday' }, { bn: 'রবিবার', en: 'Sunday' }]
            };

            // ALPHABET
            const AV = [{ b: 'অ', r: 'o' }, { b: 'আ', r: 'a' }, { b: 'ই', r: 'i' }, { b: 'ঈ', r: 'ii' }, { b: 'উ', r: 'u' }, { b: 'ঊ', r: 'uu' }, { b: 'ঋ', r: 'ri' }, { b: 'এ', r: 'e' }, { b: 'ঐ', r: 'oi' }, { b: 'ও', r: 'o' }, { b: 'ঔ', r: 'ou' }];
            const AC = [{ b: 'ক', r: 'ko' }, { b: 'খ', r: 'kho' }, { b: 'গ', r: 'go' }, { b: 'ঘ', r: 'gho' }, { b: 'ঙ', r: 'ng' }, { b: 'চ', r: 'cho' }, { b: 'ছ', r: 'chho' }, { b: 'জ', r: 'jo' }, { b: 'ঝ', r: 'jho' }, { b: 'ঞ', r: 'nyo' }, { b: 'ট', r: 'To' }, { b: 'ঠ', r: 'Tho' }, { b: 'ড', r: 'Do' }, { b: 'ঢ', r: 'Dho' }, { b: 'ণ', r: 'No' }, { b: 'ত', r: 'to' }, { b: 'থ', r: 'tho' }, { b: 'দ', r: 'do' }, { b: 'ধ', r: 'dho' }, { b: 'ন', r: 'no' }, { b: 'প', r: 'po' }, { b: 'ফ', r: 'pho' }, { b: 'ব', r: 'bo' }, { b: 'ভ', r: 'bho' }, { b: 'ম', r: 'mo' }, { b: 'য', r: 'jo' }, { b: 'র', r: 'ro' }, { b: 'ল', r: 'lo' }, { b: 'শ', r: 'sho' }, { b: 'ষ', r: 'Sho' }, { b: 'স', r: 'so' }, { b: 'হ', r: 'ho' }, { b: 'ড়', r: 'Ro' }, { b: 'ঢ়', r: 'Rho' }, { b: 'য়', r: 'yo' }, { b: 'ৎ', r: 't' }, { b: 'ং', r: 'ng' }, { b: 'ঃ', r: 'h' }, { b: 'ঁ', r: 'n' }];

            // TRANSLIT MAP
            const TR = { 'ami': 'আমি', 'tumi': 'তুমি', 'apni': 'আপনি', 'amra': 'আমরা', 'se': 'সে', 'ki': 'কি', 'keno': 'কেনো', 'kothay': 'কোথায়', 'kokhon': 'কখন', 'haan': 'হ্যাঁ', 'na': 'না', 'dhonnobad': 'ধন্যবাদ', 'namaskar': 'নমস্কার', 'bhai': 'ভাই', 'bon': 'বোন', 'ma': 'মা', 'baba': 'বাবা', 'pani': 'পানি', 'khabar': 'খাবার', 'bari': 'বাড়ি', 'ghor': 'ঘর', 'sundor': 'সুন্দর', 'bhalo': 'ভালো', 'bondhu': 'বন্ধু', 'priyo': 'প্রিয়', 'valobasha': 'ভালোবাসা', 'akash': 'আকাশ', 'shanti': 'শান্তি', 'jibon': 'জীবন', 'shopno': 'স্বপ্ন', 'desh': 'দেশ', 'bhasha': 'ভাষা', 'gaan': 'গান', 'boi': 'বই', 'shomoy': 'সময়', 'asha': 'আশা', 'hashi': 'হাসি', 'phul': 'ফুল', 'gach': 'গাছ', 'nodi': 'নদী', 'surjo': 'সূর্য', 'chand': 'চাঁদ', 'brishti': 'বৃষ্টি', 'khushi': 'খুশি', 'notun': 'নতুন' };

            // WORD OF THE DAY
            const WOD = [{ bn: 'ভালোবাসা', en: 'Love', m: 'Deep emotional attachment' }, { bn: 'আকাশ', en: 'Sky', m: 'The vast blue expanse above' }, { bn: 'স্বপ্ন', en: 'Dream', m: 'A vision of deep desires' }, { bn: 'শান্তি', en: 'Peace', m: 'Tranquility of mind and soul' }, { bn: 'জ্ঞান', en: 'Knowledge', m: 'Understanding through learning' }, { bn: 'সাহস', en: 'Courage', m: 'Ability to face fear' }, { bn: 'আনন্দ', en: 'Joy', m: 'Great happiness' }, { bn: 'বিশ্বাস', en: 'Faith', m: 'Complete confidence' }, { bn: 'সৌন্দর্য', en: 'Beauty', m: 'Quality that gives pleasure' }, { bn: 'প্রজ্ঞা', en: 'Wisdom', m: 'Experience and good judgment' }, { bn: 'কৃতজ্ঞতা', en: 'Gratitude', m: 'Being thankful' }, { bn: 'অধ্যবসায়', en: 'Perseverance', m: 'Persistence despite difficulty' }];

            const BND = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            const toBn = n => String(n).split('').map(c => BND[+c] || c).join('');

            // STORAGE
            const SK = { h: 'obd_h', b: 'obd_b' };
            function ld(k) { try { return JSON.parse(localStorage.getItem(k)) || [] } catch (e) { return [] } }
            function sv(k, d) { try { localStorage.setItem(k, JSON.stringify(d)) } catch (e) { } }
            let hist = ld(SK.h), bms = ld(SK.b);
            let dir = 'en-bn', curQ = '', curR = null, sbTab = 'hist', flIdx = 0, autoType = false;

            // DOM
            const $ = id => document.getElementById(id);
            const sInp = $('sInp'), goB = $('goB'), dirB = $('dirB'), dirTxt = $('dirTxt');
            const trRow = $('trRow'), qtRow = $('qtRow');
            const scrIn = $('scrIn'), sb = $('sb'), sbBd = $('sbBd');
            const tW = $('tW'), mO = $('mO'), mT = $('mT'), mB = $('mB'), mF = $('mF'), mOrb = $('mOrb'), bdg = $('bdg');
            const tglAuto = $('tglAuto'), tglBar = $('tglBar');

            // MOUSE ORB
            document.addEventListener('mousemove', e => { mOrb.style.left = e.clientX + 'px'; mOrb.style.top = e.clientY + 'px' });

            // BENGALI DATE
            (function () { const d = new Date(), days = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'], months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর']; $('bnDate').textContent = `${days[d.getDay()]}, ${toBn(d.getDate())} ${months[d.getMonth()]} ${toBn(d.getFullYear())}` })();

            // QUICK TAGS
            const QW = ['hello', 'love', 'আকাশ', 'beautiful', 'বন্ধু', 'peace', 'ধন্যবাদ', 'dream', 'শান্তি', 'water', 'happy', 'স্বপ্ন'];
            qtRow.innerHTML = QW.map(w => `<span class="qt" data-w="${esc(w)}"><i class="fa-solid fa-arrow-trend-up"></i>${esc(w)}</span>`).join('');
            qtRow.addEventListener('click', e => { const t = e.target.closest('.qt'); if (!t) return; sInp.value = t.dataset.w; doSearch() });

            // DIRECTION
            dirB.addEventListener('click', () => { dir = dir === 'en-bn' ? 'bn-en' : 'en-bn'; dirTxt.textContent = dir === 'en-bn' ? 'EN→BN' : 'BN→EN'; sInp.placeholder = dir === 'en-bn' ? 'Type an English word…' : 'বাংলা শব্দ লিখুন…' });

            // AUTO-TYPE TOGGLE
            tglAuto.addEventListener('click', () => {
                autoType = !autoType;
                tglBar.classList.toggle('on', autoType);
                toast(`<i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Type: ${autoType ? 'ON' : 'OFF'}`);
            });

            // TRANSLITERATION
            sInp.addEventListener('input', () => {
                const v = sInp.value.trim().toLowerCase(); trRow.innerHTML = '';
                if (!v || /[\u0980-\u09FF]/.test(v)) return;
                const m = []; for (const [r, b] of Object.entries(TR)) { if (r.startsWith(v) || v.startsWith(r)) m.push({ r, b }) }
                if (!m.length) return;

                if (autoType && v.length > 1) {
                    const selected = m.length > 1 ? m[1].b : m[0].b;
                    sInp.value = selected;
                    trRow.innerHTML = '';
                    doSearch();
                    return;
                }

                trRow.innerHTML = `<span class="tr-lbl"><i class="fa-solid fa-wand-magic-sparkles"></i> বাংলা:</span>` + m.slice(0, 6).map(x => `<span class="tr-c" data-v="${esc(x.b)}" title="${esc(x.r)}">${esc(x.b)}</span>`).join('');
            });
            trRow.addEventListener('click', e => { const c = e.target.closest('.tr-c'); if (!c) return; sInp.value = c.dataset.v; trRow.innerHTML = ''; doSearch() });

            // SEARCH
            goB.addEventListener('click', doSearch);
            sInp.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch() });

            async function doSearch() {
                const q = sInp.value.trim(); if (!q) return;
                curQ = q; trRow.innerHTML = '';
                const hasBn = /[\u0980-\u09FF]/.test(q);
                if (hasBn && dir === 'en-bn') { dir = 'bn-en'; dirTxt.textContent = 'BN→EN' }
                else if (!hasBn && dir === 'bn-en') { dir = 'en-bn'; dirTxt.textContent = 'EN→BN' }
                addHist(q, dir); showSkel();

                const from = dir === 'bn-en' ? 'bn' : 'en', dest = dir === 'bn-en' ? 'en' : 'bn';
                const p = [];
                // MyMemory Parallel Fetch
                p.push(fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${from}|${dest}`).then(r => r.json()).catch(() => null));
                // DictionaryAPI parallel fetch (English only)
                if (!hasBn) {
                    p.push(fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(q)}`).then(r => r.json()).catch(() => null));
                }

                try {
                    const [mm, da] = await Promise.all(p);
                    if (!mm || (mm.responseData.translatedText === q && !mm.matches.length)) {
                        showEmpty(q); return;
                    }
                    renderAPI(mm, da, q);
                } catch (e) { showEmpty(q) }
            }


            function renderAPI(mm, da, q) {
                const tr = [], mn = [], ps = new Set(), sn = [], ph = [];

                // Process MyMemory
                if (mm && mm.matches) {
                    mm.matches.forEach(m => {
                        if (m.translation && m.translation.toLowerCase() !== q.toLowerCase()) {
                            tr.push({ w: m.translation, m: m.reference || '' });
                        }
                        if (m.segment && m.translation && m.segment.length > 20) {
                            sn.push({ en: dir === 'en-bn' ? m.segment : m.translation, bn: dir === 'en-bn' ? m.translation : m.segment });
                        }
                    });
                }
                if (mm && mm.responseData) {
                    const mainTr = mm.responseData.translatedText;
                    if (mainTr && mainTr.toLowerCase() !== q.toLowerCase() && !tr.some(t => t.w === mainTr)) {
                        tr.unshift({ w: mainTr, m: 'Primary Translation' });
                    }
                }

                // Process DictionaryAPI
                if (da && Array.isArray(da)) {
                    const entry = da[0];
                    if (entry.phonetic) ph.push(entry.phonetic);
                    if (entry.phonetics) entry.phonetics.forEach(p => { if (p.text && !ph.includes(p.text)) ph.push(p.text) });

                    entry.meanings.forEach(m => {
                        if (m.partOfSpeech) ps.add(m.partOfSpeech);
                        m.definitions.forEach(d => {
                            if (d.definition && !mn.includes(d.definition)) mn.push(d.definition);
                            if (d.example) sn.push({ en: d.example, bn: '' });
                        });
                    });
                }

                const uniqueTr = [];
                const seenTr = new Set();
                tr.forEach(t => {
                    const clean = t.w.toLowerCase().trim();
                    if (!seenTr.has(clean)) { seenTr.add(clean); uniqueTr.push(t) }
                });

                curR = {
                    q,
                    dir,
                    tr: uniqueTr.slice(0, 10),
                    mean: mn.slice(0, 8),
                    pos: [...ps],
                    sent: sn.slice(0, 5),
                    ph: ph[0] || ''
                };
                renderRes(curR);
            }

            function renderRes(r) {
                const isBE = r.dir === 'bn-en', isbm = bms.some(b => b.word === r.q);
                let h = '';

                // Word Card
                h += `<div class="au au1"><div class="shd"><i class="fa-solid fa-sparkles shd-ico"></i><span class="shd-t">Word</span><div class="shd-ln"></div></div>
  <div class="gc wcard"><div class="wc-top"><div><div class="wc-w">${esc(r.q)}</div>
  <div class="wc-dir"><i class="fa-solid fa-right-left"></i> ${isBE ? 'বাংলা → English' : 'English → বাংলা'} ${r.ph ? `<span style="font-family:var(--en);opacity:.5;margin-left:8px;font-size:14px;font-weight:400">/${r.ph}/</span>` : ''}</div></div>
  <div class="wc-acts">
  <button class="wc-b ${isbm ? 'bmd' : ''}" id="bmB" title="${isbm ? 'Remove Bookmark' : 'Bookmark'}"><i class="fa-${isbm ? 'solid' : 'regular'} fa-bookmark"></i></button>
  <button class="wc-b" id="cpB" title="Copy"><i class="fa-regular fa-copy"></i></button>
  <button class="wc-b" id="plB" title="Play Audio"><i class="fa-solid fa-volume-high"></i></button>
  <button class="wc-b" id="ntB" title="Add Note"><i class="fa-regular fa-note-sticky"></i></button>
  </div></div>
  ${r.pos.length ? `<div class="pills">${r.pos.map(p => `<span class="pill pos"><i class="fa-solid fa-tag" style="font-size:7px;margin-right:2px"></i>${esc(p)}</span>`).join('')}</div>` : ''}</div></div>`;

                // Translations
                if (r.tr.length) {
                    h += `<div class="au au2"><div class="shd"><i class="fa-solid fa-pen-fancy shd-ico"></i><span class="shd-t">Translations</span><div class="shd-ln"></div></div>
    <div class="tl">${r.tr.map((t, i) => { const isB = /[\u0980-\u09FF]/.test(t.w); return `<div class="gc ti"><div class="tn">${i + 1}</div><div class="tc"><div class="tw ${isB ? '' : 'enw'}">${esc(t.w)}</div>${t.m ? `<div class="tm">${esc(t.m)}</div>` : ''}</div><button class="sba tr-pl" data-w="${esc(t.w)}" data-l="${isB ? 'bn' : 'en'}" title="Play Audio"><i class="fa-solid fa-volume-high"></i></button></div>` }).join('')}</div></div>`;
                }

                // Meanings
                if (r.mean.length) {
                    h += `<div class="au au3"><div class="shd"><i class="fa-solid fa-lightbulb shd-ico"></i><span class="shd-t">Definitions</span><div class="shd-ln"></div></div>
    ${r.mean.map(m => { const isB = /[\u0980-\u09FF]/.test(m); return `<div class="gc mi" style="margin-bottom:7px"><div class="mt ${isB ? 'bnm' : ''}">${esc(m)}</div></div>` }).join('')}</div>`;
                }

                // Sentences
                if (r.sent.length) {
                    h += `<div class="au au4"><div class="shd"><i class="fa-solid fa-flask shd-ico"></i><span class="shd-t">Parallel Sentence Lab</span><div class="shd-ln"></div></div>
    <div class="sg">${r.sent.map(s => {
                        let et = hl(s.en || '', r.q), bt = hl(s.bn || '', r.q);
                        if (r.tr.length) { et = hl(et, r.tr[0].w); bt = hl(bt, r.tr[0].w) }
                        return `<div class="gc sp"><div class="sr"><span class="sl sen">EN</span><div class="st">${et}</div></div><div class="sr"><span class="sl sbn">BN</span><div class="st bnt">${bt}</div></div></div>`
                    }).join('')}</div></div>`;
                }

                scrIn.innerHTML = h; $('scr').scrollTop = 0;

                // Bind
                const bmB = $('bmB'); if (bmB) bmB.onclick = () => toggleBM(r);
                const cpB = $('cpB'); if (cpB) cpB.onclick = () => { navigator.clipboard.writeText(r.tr.map(t => t.w).join(', ')).then(() => toast('<i class="fa-solid fa-check" style="color:var(--ok)"></i> Copied!')).catch(() => toast('<i class="fa-solid fa-xmark" style="color:var(--err)"></i> Failed')) };
                const plB = $('plB'); if (plB) plB.onclick = () => playAudio(r.q, /[\u0980-\u09FF]/.test(r.q) ? 'bn' : 'en');
                const ntB = $('ntB'); if (ntB) ntB.onclick = () => openNoteModal(r.q);
                scrIn.querySelectorAll('.tr-pl').forEach(el => el.onclick = () => playAudio(el.dataset.w, el.dataset.l));
            }

            // STATES
            function showSkel() { scrIn.innerHTML = `<div class="gc" style="padding:22px;margin-bottom:10px"><div class="sk h26 w60"></div><div class="sk w40"></div><div class="skp"><div class="skpl"></div><div class="skpl"></div></div></div><div class="gc" style="padding:22px;margin-bottom:10px"><div class="sk h18 w80"></div><div class="sk w60"></div><div class="sk w90"></div></div><div class="gc" style="padding:22px"><div class="sk h18 w60"></div><div class="sk w80"></div></div>` }

            function showEmpty(q) {
                const sug = QW.filter(w => w !== q).slice(0, 5);
                scrIn.innerHTML = `<div class="state"><div class="state-ico"><i class="fa-solid fa-magnifying-glass"></i></div><div class="state-t">No Results Found</div><div class="state-d">We couldn't find translations for "<strong>${esc(q)}</strong>". Try one of these:</div>
  <div class="qt-row" style="justify-content:center;margin-top:12px">${sug.map(w => `<span class="qt" data-w="${esc(w)}">${esc(w)}</span>`).join('')}</div></div>`;
                scrIn.querySelectorAll('.qt').forEach(t => t.onclick = () => { sInp.value = t.dataset.w; doSearch() });
            }

            function showDash() {
                const wod = WOD[Math.floor(Date.now() / 864e5) % WOD.length];
                let h = `<div class="dash">`;

                h += `<div class="gc dc au au1"><div class="dc-hd"><div class="dc-ico pur"><i class="fa-solid fa-sun"></i></div><div><div class="dc-title">Word of the Day</div><div class="dc-sub">Daily vocabulary</div></div></div>
  <div class="wod-bn">${esc(wod.bn)}</div><div class="wod-en">${esc(wod.en)}</div><div class="wod-m">${esc(wod.m)}</div>
  <div class="dc-act" data-w="${esc(wod.bn)}"><i class="fa-solid fa-magnifying-glass"></i> Look up</div></div>`;

                h += `<div class="gc dc au au2"><div class="dc-hd"><div class="dc-ico cyn"><i class="fa-solid fa-chart-pie"></i></div><div><div class="dc-title">Your Statistics</div><div class="dc-sub">Learning progress</div></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><div class="dc-stat">${hist.length}</div><div class="dc-stat-lbl"><i class="fa-solid fa-magnifying-glass" style="font-size:8px"></i> Searches</div></div><div><div class="dc-stat">${bms.length}</div><div class="dc-stat-lbl"><i class="fa-solid fa-bookmark" style="font-size:8px"></i> Bookmarks</div></div></div></div>`;

                const fc = Object.keys(PH)[0], fp = PH[fc].slice(0, 4);
                h += `<div class="gc dc au au3"><div class="dc-hd"><div class="dc-ico pnk"><i class="fa-solid fa-comments"></i></div><div><div class="dc-title">Quick Phrases</div><div class="dc-sub">${fc}</div></div></div>
  <ul class="dc-list">${fp.map(p => `<li><span class="lb">${esc(p.bn)}</span><span class="le">${esc(p.en)}</span></li>`).join('')}</ul>
  <div class="dc-act" id="dPH"><i class="fa-solid fa-book-open"></i> Full Phrasebook</div></div>`;

                h += `<div class="gc dc au au4"><div class="dc-hd"><div class="dc-ico amb"><i class="fa-solid fa-hashtag"></i></div><div><div class="dc-title">Number Converter</div><div class="dc-sub">English ↔ Bengali numerals</div></div></div>
  <div class="numc"><input class="numinp" id="numI" placeholder="123" maxlength="15"><div class="numarr"><i class="fa-solid fa-right-left"></i></div><div class="numout" id="numO">১২৩</div></div></div>`;

                if (bms.length) {
                    h += `<div class="gc dc au au5"><div class="dc-hd"><div class="dc-ico grn"><i class="fa-solid fa-star"></i></div><div><div class="dc-title">Recent Bookmarks</div><div class="dc-sub">${bms.length} saved</div></div></div>
    <ul class="dc-list">${bms.slice(0, 5).map(b => `<li data-w="${esc(b.word)}"><span class="lb">${esc(b.word)}</span>${b.note ? `<span class="le" style="font-style:italic;font-size:9px">${esc(b.note.slice(0, 20))}…</span>` : ''}</li>`).join('')}</ul></div>`;
                }

                h += `<div class="gc dc au au6"><div class="dc-hd"><div class="dc-ico pur"><i class="fa-solid fa-language"></i></div><div><div class="dc-title">Bengali Alphabet</div><div class="dc-sub">Vowels & Consonants</div></div></div>
  <div style="font-family:var(--bn);font-size:16px;letter-spacing:3px;text-rendering:optimizeLegibility;color:var(--t1)">অ আ ই ঈ উ ঊ এ ঐ ও ঔ …</div>
  <div class="dc-act" id="dAL"><i class="fa-solid fa-table-cells"></i> View Full Chart</div></div>`;

                h += `</div>`; scrIn.innerHTML = h;

                scrIn.querySelectorAll('.dc-act[data-w]').forEach(el => el.onclick = () => { sInp.value = el.dataset.w; doSearch() });
                scrIn.querySelectorAll('.dc-list li[data-w]').forEach(el => el.onclick = () => { sInp.value = el.dataset.w; doSearch() });
                const dPH = scrIn.querySelector('#dPH'); if (dPH) dPH.onclick = () => openPhrases();
                const dAL = scrIn.querySelector('#dAL'); if (dAL) dAL.onclick = () => openAlpha();
                const numI = $('numI'); if (numI) numI.oninput = () => { const v = numI.value, hb = /[\u0980-\u09FF]/.test(v); $('numO').textContent = hb ? v.split('').map(c => { const i = BND.indexOf(c); return i >= 0 ? i : c }).join('') : v.split('').map(c => /\d/.test(c) ? BND[+c] : c).join('') };
            }

            // HISTORY
            function addHist(w, d) { hist = hist.filter(h => h.w !== w); hist.unshift({ w, d, t: Date.now() }); if (hist.length > 50) hist.pop(); sv(SK.h, hist); updBdg(); if (sb.classList.contains('open')) renderSB() }

            // BOOKMARKS
            function toggleBM(r) {
                const idx = bms.findIndex(b => b.word === r.q);
                if (idx > -1) { bms.splice(idx, 1); toast('<i class="fa-regular fa-bookmark" style="color:var(--t2)"></i> Bookmark removed') }
                else { bms.unshift({ word: r.q, dir: r.dir, translations: r.tr.map(t => t.w), note: '', ts: Date.now() }); toast('<i class="fa-solid fa-bookmark" style="color:var(--warn)"></i> Bookmarked!') }
                sv(SK.b, bms); updBdg();
                if (curR && curR.q === r.q) renderRes(curR);
                if (sb.classList.contains('open')) renderSB();
            }

            function updBdg() { const c = bms.length; bdg.textContent = c; bdg.classList.toggle('vis', c > 0) }
            updBdg();

            // SIDEBAR
            $('bSB').onclick = () => { sb.classList.toggle('open'); renderSB() };
            $('sbX').onclick = () => sb.classList.remove('open');

            $('sbTabs').addEventListener('click', e => { const t = e.target.closest('.sb-tab'); if (!t) return; sbTab = t.dataset.t; document.querySelectorAll('.sb-tab').forEach(x => x.classList.remove('on')); t.classList.add('on'); $('sbSW').classList.toggle('vis', sbTab === 'bm'); renderSB() });

            $('sbSI').addEventListener('input', () => renderSB());

            $('sbExp').onclick = () => {
                const data = JSON.stringify({ bookmarks: bms, history: hist }, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                a.download = 'obidhan_backup.json'; a.click();
                toast('<i class="fa-solid fa-download" style="color:var(--ok)"></i> Exported!');
            };

            $('sbClr').onclick = () => {
                if (sbTab === 'hist') { hist = []; sv(SK.h, hist) } else { bms = []; sv(SK.b, bms); updBdg() }
                renderSB(); toast('<i class="fa-solid fa-trash" style="color:var(--err)"></i> Cleared');
            };

            function renderSB() {
                const filter = $('sbSI').value.trim().toLowerCase();
                let h = '';
                if (sbTab === 'hist') {
                    if (!hist.length) { sbBd.innerHTML = `<div class="sb-empty"><i class="fa-solid fa-clock-rotate-left"></i><div>Your search history will<br>appear here</div></div>`; return }
                    h += `<div class="sb-lbl"><i class="fa-solid fa-clock-rotate-left"></i> Recent Searches</div>`;
                    hist.forEach(it => {
                        const isbm = bms.some(b => b.word === it.w);
                        h += `<div class="sb-item" data-w="${esc(it.w)}" data-d="${it.d}"><div class="sb-item-ico"><i class="fa-solid fa-rotate-left"></i></div><div class="sb-item-body"><div class="sb-item-word">${esc(it.w)}</div><div class="sb-item-meta"><i class="fa-solid fa-arrow-right-arrow-left" style="font-size:7px"></i> ${it.d === 'bn-en' ? 'BN→EN' : 'EN→BN'} · ${timeAgo(it.t)}</div></div>
      <div class="sb-item-acts"><button class="sba ${isbm ? 'faved' : ''}" data-fav="${esc(it.w)}" title="Bookmark"><i class="fa-${isbm ? 'solid' : 'regular'} fa-bookmark"></i></button><button class="sba del" data-del="${esc(it.w)}" title="Remove"><i class="fa-solid fa-xmark"></i></button></div></div>`;
                    });
                } else {
                    const filtered = filter ? bms.filter(b => b.word.toLowerCase().includes(filter)) : bms;
                    if (!filtered.length) { sbBd.innerHTML = `<div class="sb-empty"><i class="fa-solid fa-star"></i><div>${filter ? 'No matches found' : 'Save words to your<br>personal collection'}</div></div>`; return }
                    h += `<div class="sb-lbl"><i class="fa-solid fa-star"></i> ${filtered.length} Bookmarks</div>`;
                    filtered.forEach(b => {
                        h += `<div class="sb-item" data-w="${esc(b.word)}" data-d="${b.dir || 'en-bn'}"><div class="sb-item-ico"><i class="fa-solid fa-bookmark" style="color:var(--warn)"></i></div><div class="sb-item-body"><div class="sb-item-word">${esc(b.word)}</div>${b.translations ? `<div class="sb-item-meta">${esc(b.translations.slice(0, 3).join(', '))}</div>` : ''}${b.note ? `<div class="sb-item-note"><i class="fa-solid fa-note-sticky" style="font-size:7px"></i> ${esc(b.note.slice(0, 30))}</div>` : ''}</div>
      <div class="sb-item-acts"><button class="sba" data-nt="${esc(b.word)}" title="Note"><i class="fa-regular fa-note-sticky"></i></button><button class="sba del" data-delbm="${esc(b.word)}" title="Remove"><i class="fa-solid fa-trash"></i></button></div></div>`;
                    });
                }
                sbBd.innerHTML = h;

                // Bind sidebar items
                sbBd.querySelectorAll('.sb-item').forEach(el => el.addEventListener('click', e => {
                    if (e.target.closest('.sba')) return;
                    sInp.value = el.dataset.w;
                    const d = el.dataset.d; if (d) { dir = d; dirTxt.textContent = d === 'en-bn' ? 'EN→BN' : 'BN→EN' }
                    doSearch(); if (innerWidth < 768) sb.classList.remove('open');
                }));
                sbBd.querySelectorAll('[data-fav]').forEach(el => el.onclick = e => {
                    e.stopPropagation(); const w = el.dataset.fav;
                    const idx = bms.findIndex(b => b.word === w);
                    if (idx > -1) { bms.splice(idx, 1); toast('<i class="fa-regular fa-bookmark"></i> Removed') }
                    else { bms.unshift({ word: w, dir: dir, translations: [], note: '', ts: Date.now() }); toast('<i class="fa-solid fa-bookmark" style="color:var(--warn)"></i> Bookmarked!') }
                    sv(SK.b, bms); updBdg(); renderSB();
                });
                sbBd.querySelectorAll('[data-del]').forEach(el => el.onclick = e => { e.stopPropagation(); hist = hist.filter(h => h.w !== el.dataset.del); sv(SK.h, hist); renderSB() });
                sbBd.querySelectorAll('[data-delbm]').forEach(el => el.onclick = e => { e.stopPropagation(); bms = bms.filter(b => b.word !== el.dataset.delbm); sv(SK.b, bms); updBdg(); renderSB() });
                sbBd.querySelectorAll('[data-nt]').forEach(el => el.onclick = e => { e.stopPropagation(); openNoteModal(el.dataset.nt) });
            }

            // MODALS
            function openModal(title, icon, bodyHtml, footHtml) { mT.innerHTML = `<i class="fa-solid fa-${icon}"></i> ${title}`; mB.innerHTML = bodyHtml; mF.innerHTML = footHtml || ''; mO.classList.add('open') }
            function closeModal() { mO.classList.remove('open') }
            $('mX').onclick = closeModal;
            mO.addEventListener('click', e => { if (e.target === mO) closeModal() });

            // NOTE MODAL
            function openNoteModal(word) {
                const bm = bms.find(b => b.word === word);
                const curNote = bm ? bm.note : '';
                openModal('Add Note', 'note-sticky', `
    <div style="font-family:var(--bn);font-size:20px;font-weight:600;margin-bottom:4px;text-rendering:optimizeLegibility">${esc(word)}</div>
    <label class="form-lbl"><i class="fa-regular fa-note-sticky"></i> Your Note</label>
    <textarea class="note-ta" id="noteTA" placeholder="Add a personal note, mnemonic, or context…">${esc(curNote)}</textarea>
  `, `<button class="mbtn gho" onclick="closeModal()"><i class="fa-solid fa-xmark"></i> Cancel</button><button class="mbtn pri" id="saveNt"><i class="fa-solid fa-check"></i> Save</button>`);

                $('saveNt').onclick = () => {
                    const note = $('noteTA').value.trim();
                    let bm = bms.find(b => b.word === word);
                    if (!bm) { bms.unshift({ word, dir, translations: [], note, ts: Date.now() }); toast('<i class="fa-solid fa-bookmark" style="color:var(--warn)"></i> Bookmarked with note!') }
                    else { bm.note = note; toast('<i class="fa-solid fa-check" style="color:var(--ok)"></i> Note saved!') }
                    sv(SK.b, bms); updBdg(); closeModal();
                    if (sb.classList.contains('open')) renderSB();
                    if (curR) renderRes(curR);
                };
            }

            // PHRASEBOOK
            $('bPhrase').onclick = openPhrases;
            function openPhrases() {
                let h = '';
                for (const [cat, phrases] of Object.entries(PH)) {
                    h += `<div class="ph-cat"><div class="ph-cat-t">${cat}</div>`;
                    phrases.forEach(p => { h += `<div class="ph-item"><span class="ph-bn">${esc(p.bn)}</span><span class="ph-en">${esc(p.en)}</span><span class="ph-copy" data-cp="${esc(p.bn)}"><i class="fa-regular fa-copy"></i></span></div>` });
                    h += `</div>`;
                }
                openModal('Phrasebook', 'comments', h, '');
                mB.querySelectorAll('.ph-copy').forEach(el => el.onclick = e => { e.stopPropagation(); navigator.clipboard.writeText(el.dataset.cp); toast('<i class="fa-solid fa-check" style="color:var(--ok)"></i> Copied!') });
                mB.querySelectorAll('.ph-item').forEach(el => el.onclick = () => { sInp.value = el.querySelector('.ph-bn').textContent; closeModal(); doSearch() });
            }

            // ALPHABET
            $('bAlpha').onclick = openAlpha;
            function openAlpha() {
                let h = `<div class="alp-sec"><div class="alp-sec-t"><i class="fa-solid fa-circle" style="font-size:6px"></i> Vowels (স্বরবর্ণ)</div><div class="alp-grid">${AV.map(a => `<div class="alp-c" data-l="${esc(a.b)}"><span class="alp-bn">${esc(a.b)}</span><span class="alp-rm">${esc(a.r)}</span></div>`).join('')}</div></div>`;
                h += `<div class="alp-sec"><div class="alp-sec-t"><i class="fa-solid fa-circle" style="font-size:6px"></i> Consonants (ব্যঞ্জনবর্ণ)</div><div class="alp-grid">${AC.map(a => `<div class="alp-c" data-l="${esc(a.b)}"><span class="alp-bn">${esc(a.b)}</span><span class="alp-rm">${esc(a.r)}</span></div>`).join('')}</div></div>`;
                openModal('Bengali Alphabet', 'language', h, '');
                mB.querySelectorAll('.alp-c').forEach(el => el.onclick = () => { sInp.value = el.dataset.l; closeModal(); doSearch() });
            }

            // FLASHCARDS
            $('bFlash').onclick = openFlash;
            function openFlash() {
                if (!bms.length) { toast('<i class="fa-solid fa-info-circle" style="color:var(--a3)"></i> Bookmark words first!'); return }
                flIdx = 0; renderFlash();
            }
            function renderFlash() {
                const b = bms[flIdx]; if (!b) return;
                const e = D[b.word.toLowerCase()] || D[b.word];
                const answer = e ? (e.en || e.bn || []).join(', ') : b.translations ? b.translations.join(', ') : '—';
                openModal(`Flashcards <span style="font-size:11px;color:var(--t3);font-weight:400">${flIdx + 1}/${bms.length}</span>`, 'clone', `
    <div class="fl-w"><div class="fl-inner" id="flI"><div class="fl-f"><div class="fl-word">${esc(b.word)}</div><div class="fl-hint"><i class="fa-solid fa-hand-pointer"></i> Tap to reveal</div></div>
    <div class="fl-b"><div class="fl-ans">${esc(answer)}</div>${b.note ? `<div class="fl-note"><i class="fa-solid fa-note-sticky" style="font-size:9px"></i> ${esc(b.note)}</div>` : ''}</div></div></div>
    <div class="fl-ctrls">
    <button class="fl-btn prev-b" id="flP"><i class="fa-solid fa-arrow-left"></i> Prev</button>
    <button class="fl-btn flip-b" id="flF"><i class="fa-solid fa-rotate"></i> Flip</button>
    <button class="fl-btn next-b" id="flN">Next <i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <div class="fl-counter"><i class="fa-solid fa-layer-group" style="font-size:9px"></i> ${flIdx + 1} of ${bms.length} cards</div>
  `, '');

                const flI = $('flI'), flF = $('flF'), flP = $('flP'), flN = $('flN');
                flF.onclick = () => flI.classList.toggle('flip');
                flP.onclick = () => { if (flIdx > 0) { flIdx--; renderFlash() } };
                flN.onclick = () => { if (flIdx < bms.length - 1) { flIdx++; renderFlash() } };
                // Tap card to flip
                flI.onclick = () => flI.classList.toggle('flip');
            }

            // TOAST
            function toast(html) {
                const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = html;
                tW.appendChild(el);
                setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300) }, 2400);
            }

            // LOGO -> Dashboard
            $('logoClick').addEventListener('click', e => { e.preventDefault(); sInp.value = ''; curR = null; showDash() });

            // UTILS
            function playAudio(w, l) {
                if (!w) return;
                const u = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${l}&client=tw-ob&q=${encodeURIComponent(w)}`;
                const a = new Audio(u);
                a.play().catch(() => toast('<i class="fa-solid fa-xmark" style="color:var(--err)"></i> Audio failed'));
            }

            function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML }
            function strip(s) { if (!s) return ''; const d = document.createElement('div'); d.innerHTML = s; return d.textContent || '' }
            function sg(o, p, f) { try { return p.split('.').reduce((a, k) => a == null ? f : a[k], o) ?? f } catch (e) { return f } }
            function hl(t, w) {
                if (!t || !w) return esc(strip(t));
                const st = strip(t), sw = strip(w);
                if (!sw) return esc(st);
                try {
                    const safeW = sw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(`(${safeW})`, 'gi');
                    return esc(st).replace(regex, '<span class="highlight">$1</span>');
                } catch (e) { return esc(st) }
            }
            function timeAgo(ts) {
                const s = Math.floor((Date.now() - ts) / 1000);
                if (s < 60) return 'just now';
                if (s < 3600) return Math.floor(s / 60) + 'm ago';
                if (s < 86400) return Math.floor(s / 3600) + 'h ago';
                if (s < 604800) return Math.floor(s / 86400) + 'd ago';
                return new Date(ts).toLocaleDateString();
            }

            // INIT
            showDash();
            sInp.focus();

            // Keyboard shortcut: Ctrl+K to focus search
            document.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); sInp.focus(); sInp.select() }
                if (e.key === 'Escape') { closeModal(); sb.classList.remove('open') }
            });

            // Import functionality via drag & drop on sidebar
            sb.addEventListener('dragover', e => { e.preventDefault(); sb.style.borderColor = 'rgba(139,92,246,.4)' });
            sb.addEventListener('dragleave', () => { sb.style.borderColor = '' });
            sb.addEventListener('drop', e => {
                e.preventDefault(); sb.style.borderColor = '';
                const file = e.dataTransfer.files[0];
                if (!file || !file.name.endsWith('.json')) return toast('<i class="fa-solid fa-xmark" style="color:var(--err)"></i> Invalid file');
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.bookmarks) {
                            const imported = data.bookmarks.filter(b => b.word && !bms.some(x => x.word === b.word));
                            bms = [...imported, ...bms]; sv(SK.b, bms); updBdg();
                        }
                        if (data.history) {
                            const impH = data.history.filter(h => h.w);
                            hist = [...impH, ...hist].slice(0, 50); sv(SK.h, hist);
                        }
                        renderSB(); showDash();
                        toast(`<i class="fa-solid fa-check" style="color:var(--ok)"></i> Imported ${(data.bookmarks || []).length} bookmarks`);
                    } catch (err) { toast('<i class="fa-solid fa-xmark" style="color:var(--err)"></i> Parse error') }
                };
                reader.readAsText(file);
            });

        })();
    </script>
</body>
