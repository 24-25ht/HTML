<html lang="en">

<head>

    <link rel="apple-touch-icon"

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        :root {
            --g1: rgba(255, 255, 255, 0.04);
            --g2: rgba(255, 255, 255, 0.07);
            --g3: rgba(255, 255, 255, 0.10);
            --gb: rgba(255, 255, 255, 0.06);
            --gb2: rgba(255, 255, 255, 0.10);
            --gb3: rgba(255, 255, 255, 0.16);
            --a1: #8b5cf6;
            --a2: #ec4899;
            --a3: #06b6d4;
            --a4: #f59e0b;
            --a5: #22c55e;
            --ag1: rgba(139, 92, 246, 0.3);
            --ag2: rgba(236, 72, 153, 0.25);
            --t1: #f2eef9;
            --t2: rgba(242, 238, 249, 0.6);
            --t3: rgba(242, 238, 249, 0.3);
            --t4: rgba(242, 238, 249, 0.15);
            --bg: #0a0a14;
            --bg2: #0f0f1a;
            --ok: #34d399;
            --warn: #fbbf24;
            --err: #f87171;
            --bn: 'Hind Siliguri', sans-serif;
            --en: 'Inter', sans-serif;
            --spring: cubic-bezier(.34, 1.56, .64, 1);
            --ease: cubic-bezier(.4, 0, .2, 1);
            --sbw: 290px;
            --radius: 16px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--en);
            background: var(--bg);
            color: var(--t1);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility
        }

        /* BG */
        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            will-change: transform
        }

        .o1 {
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(139, 92, 246, .2), transparent 70%);
            top: -18%;
            left: -8%;
            animation: oF1 26s ease-in-out infinite
        }

        .o2 {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(236, 72, 153, .16), transparent 70%);
            bottom: -18%;
            right: -8%;
            animation: oF2 30s ease-in-out infinite
        }

        .o3 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(6, 182, 212, .10), transparent 70%);
            top: 50%;
            left: 50%;
            animation: oF3 22s ease-in-out infinite
        }

        .om {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, .07), rgba(236, 72, 153, .03) 40%, transparent 60%);
            transform: translate(-50%, -50%);
            transition: left .12s, top .12s
        }

        @keyframes oF1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(70px, 50px) scale(1.08)
            }
        }

        @keyframes oF2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(-55px, -70px) scale(1.12)
            }
        }

        @keyframes oF3 {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(-35px, 45px) scale(.92)
            }
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: .016;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 128px
        }

        /* APP */
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2
        }

        /* HEADER */
        .hdr {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 12px;
            border-bottom: 1px solid var(--gb);
            background: rgba(10, 10, 20, .65);
            backdrop-filter: blur(28px) saturate(180%);
            flex-shrink: 0;
            z-index: 30;
            position: relative
        }

        .hdr::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, .15), rgba(236, 72, 153, .15), transparent)
        }

        .highlight {
            background: rgba(139, 92, 246, 0.2);
            color: var(--a1);
            font-weight: 600;
            padding: 0 4px;
            border-radius: 4px;
        }

        /* Toggle Switch */
        .tgl-w {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 20px;
            height: 32px;
            margin-right: 10px;
            cursor: pointer;
            transition: all .2s;
            user-select: none;
        }

        .tgl-w:hover {
            background: var(--g2);
            border-color: var(--gb2);
        }

        .tgl-lbl {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--t3);
        }

        .tgl {
            position: relative;
            width: 32px;
            height: 18px;
            background: var(--gb);
            border-radius: 10px;
            transition: background .3s;
        }

        .tgl::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            transition: transform .3s;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .2);
        }

        .tgl.on {
            background: var(--a1);
        }

        .tgl.on::after {
            transform: translateX(14px);
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            cursor: pointer
        }

        .logo-mark {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--a1), var(--a2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 3px 16px var(--ag1);
            overflow: hidden
        }

        .logo-mark::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, .22), transparent 60%);
            border-radius: inherit
        }

        .logo-mark i {
            font-size: 16px;
            color: #fff;
            position: relative;
            z-index: 1
        }

        .logo-txt {
            display: flex;
            flex-direction: column
        }

        .logo-bn {
            font-family: var(--bn);
            font-weight: 700;
            font-size: 16px;
            line-height: 1.1;
            background: linear-gradient(135deg, #fff, rgba(255, 255, 255, .7));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .logo-en {
            font-size: 9.5px;
            color: var(--t3);
            letter-spacing: .4px;
            font-weight: 500
        }

        .hdr-center {
            flex: 1;
            display: flex;
            justify-content: center
        }

        .bn-date {
            font-family: var(--bn);
            font-size: 11px;
            color: var(--t3);
            background: var(--g1);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--gb);
            text-rendering: optimizeLegibility
        }

        .hdr-actions {
            display: flex;
            gap: 5px
        }

        .hb {
            width: 36px;
            height: 36px;
            border: 1px solid var(--gb);
            background: var(--g1);
            border-radius: 9px;
            color: var(--t2);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .22s var(--ease);
            backdrop-filter: blur(10px);
            position: relative
        }

        .hb:hover {
            background: var(--g2);
            color: var(--t1);
            border-color: var(--gb2);
            transform: translateY(-1px)
        }

        .hb .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 16px;
            height: 16px;
            background: linear-gradient(135deg, var(--a1), var(--a2));
            border-radius: 8px;
            font-size: 8px;
            font-weight: 800;
            display: none;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 0 4px;
            border: 2px solid var(--bg);
            line-height: 1
        }

        .hb .badge.vis {
            display: flex
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative
        }

        /* SIDEBAR */
        .sb {
            width: 0;
            overflow: hidden;
            background: rgba(10, 10, 20, .82);
            backdrop-filter: blur(32px) saturate(180%);
            border-right: 1px solid var(--gb);
            transition: width .35s var(--ease);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            z-index: 20
        }

        .sb.open {
            width: var(--sbw)
        }

        .sb-hd {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--gb);
            flex-shrink: 0
        }

        .sb-hd-title {
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 7px
        }

        .sb-hd-title i {
            color: var(--a1);
            font-size: 12px
        }

        .sb-x {
            width: 26px;
            height: 26px;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 7px;
            color: var(--t3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            transition: all .2s
        }

        .sb-x:hover {
            background: var(--g2);
            color: var(--t1)
        }

        .sb-tabs {
            display: flex;
            border-bottom: 1px solid var(--gb);
            flex-shrink: 0
        }

        .sb-tab {
            flex: 1;
            padding: 10px 4px;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--t3);
            cursor: pointer;
            transition: all .22s;
            border-bottom: 2px solid transparent;
            text-transform: uppercase;
            letter-spacing: .7px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px
        }

        .sb-tab:hover {
            color: var(--t2);
            background: var(--g1)
        }

        .sb-tab.on {
            color: var(--a1);
            border-bottom-color: var(--a1);
            background: rgba(139, 92, 246, .04)
        }

        .sb-tab i {
            font-size: 10px
        }

        .sb-search {
            padding: 8px 10px;
            flex-shrink: 0;
            display: none
        }

        .sb-search.vis {
            display: block
        }

        .sb-sinput {
            width: 100%;
            padding: 7px 10px 7px 30px;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 8px;
            color: var(--t1);
            font-size: 11px;
            font-family: var(--bn);
            outline: none;
            transition: border-color .3s
        }

        .sb-sinput:focus {
            border-color: rgba(139, 92, 246, .3)
        }

        .sb-sinput::placeholder {
            color: var(--t4)
        }

        .sb-search-wrap {
            position: relative
        }

        .sb-search-wrap i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: var(--t4)
        }

        .sb-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 6px 8px
        }

        .sb-body::-webkit-scrollbar {
            width: 3px
        }

        .sb-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .06);
            border-radius: 2px
        }

        .sb-lbl {
            font-size: 8.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: var(--t4);
            padding: 10px 8px 5px;
            display: flex;
            align-items: center;
            gap: 5px
        }

        .sb-lbl i {
            font-size: 8px
        }

        .sb-empty {
            text-align: center;
            padding: 36px 14px;
            color: var(--t4);
            font-size: 12px;
            line-height: 1.7
        }

        .sb-empty i {
            font-size: 28px;
            display: block;
            margin-bottom: 10px;
            opacity: .3
        }

        .sb-item {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 10px;
            border-radius: 9px;
            cursor: pointer;
            transition: all .18s;
            margin-bottom: 1px
        }

        .sb-item:hover {
            background: var(--g2)
        }

        .sb-item-ico {
            font-size: 11px;
            color: var(--t3);
            width: 18px;
            text-align: center;
            flex-shrink: 0
        }

        .sb-item-body {
            flex: 1;
            min-width: 0
        }

        .sb-item-word {
            font-family: var(--bn);
            font-size: 13px;
            font-weight: 500;
            color: var(--t1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-rendering: optimizeLegibility
        }

        .sb-item-meta {
            font-size: 9px;
            color: var(--t4);
            margin-top: 1px;
            display: flex;
            align-items: center;
            gap: 4px
        }

        .sb-item-note {
            font-size: 9px;
            color: var(--a1);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-style: italic
        }

        .sb-item-acts {
            display: flex;
            gap: 1px;
            opacity: 0;
            transition: opacity .18s;
            flex-shrink: 0
        }

        .sb-item:hover .sb-item-acts {
            opacity: 1
        }

        .sba {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: var(--t4);
            cursor: pointer;
            border-radius: 5px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s
        }

        .sba:hover {
            background: var(--g2);
            color: var(--t1)
        }

        .sba.del:hover {
            color: var(--err)
        }

        .sba.faved {
            color: var(--warn)
        }

        .sb-foot {
            padding: 8px 10px;
            border-top: 1px solid var(--gb);
            flex-shrink: 0;
            display: flex;
            gap: 6px
        }

        .sb-fbtn {
            flex: 1;
            padding: 7px;
            border-radius: 7px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-family: var(--en)
        }

        .sb-fbtn.exp {
            background: rgba(139, 92, 246, .08);
            border: 1px solid rgba(139, 92, 246, .18);
            color: var(--a1)
        }

        .sb-fbtn.exp:hover {
            background: rgba(139, 92, 246, .15)
        }

        .sb-fbtn.clr {
            background: rgba(248, 113, 113, .06);
            border: 1px solid rgba(248, 113, 113, .14);
            color: var(--err)
        }

        .sb-fbtn.clr:hover {
            background: rgba(248, 113, 113, .12)
        }

        .sb-fbtn i {
            font-size: 9px
        }

        /* CONTENT */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0
        }

        /* SEARCH */
        .srch-area {
            padding: 18px 20px 10px;
            flex-shrink: 0
        }

        .srch-wrap {
            max-width: 700px;
            margin: 0 auto
        }

        .srch-box {
            display: flex;
            align-items: center;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 14px;
            transition: all .3s var(--ease);
            backdrop-filter: blur(20px) saturate(180%);
            overflow: hidden;
            position: relative
        }

        .srch-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(139, 92, 246, .02), rgba(236, 72, 153, .01));
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s
        }

        .srch-box:focus-within {
            border-color: rgba(139, 92, 246, .32);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, .06), 0 8px 36px rgba(0, 0, 0, .3);
            background: rgba(255, 255, 255, .055)
        }

        .srch-box:focus-within::before {
            opacity: 1
        }

        .si {
            padding: 0 0 0 15px;
            font-size: 13px;
            color: var(--t4);
            transition: color .3s;
            flex-shrink: 0
        }

        .srch-box:focus-within .si {
            color: var(--a1)
        }

        .sinput {
            flex: 1;
            padding: 14px 11px;
            background: none;
            border: none;
            outline: none;
            color: var(--t1);
            font-size: 14.5px;
            font-family: var(--bn);
            font-weight: 500;
            min-width: 0
        }

        .sinput::placeholder {
            color: var(--t4);
            font-weight: 400
        }

        .dir-b {
            padding: 6px 9px;
            margin: 5px 3px;
            border: 1px solid var(--gb);
            background: var(--g1);
            border-radius: 7px;
            color: var(--t2);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
            letter-spacing: .2px;
            font-family: var(--en);
            display: flex;
            align-items: center;
            gap: 4px
        }

        .dir-b:hover {
            background: var(--g2);
            color: var(--t1)
        }

        .dir-b i {
            font-size: 9px
        }

        .go-b {
            padding: 9px 18px;
            margin: 5px 5px 5px 2px;
            background: linear-gradient(135deg, var(--a1), var(--a2));
            border: none;
            border-radius: 9px;
            color: #fff;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all .22s var(--spring);
            font-family: var(--en);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .go-b::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, .18), transparent 60%);
            opacity: 0;
            transition: opacity .3s
        }

        .go-b:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 22px var(--ag1)
        }

        .go-b:hover::before {
            opacity: 1
        }

        .go-b:active {
            transform: scale(.96)
        }

        .go-b i {
            font-size: 11px
        }

        /* Translit */
        .tr-row {
            max-width: 700px;
            margin: 5px auto 0;
            min-height: 22px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap
        }

        .tr-lbl {
            font-size: 9px;
            color: var(--t4);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 3px
        }

        .tr-lbl i {
            font-size: 8px
        }

        .tr-c {
            font-family: var(--bn);
            font-size: 12px;
            padding: 2px 9px;
            background: rgba(139, 92, 246, .08);
            border: 1px solid rgba(139, 92, 246, .18);
            border-radius: 14px;
            color: var(--a1);
            cursor: pointer;
            transition: all .18s;
            font-weight: 500;
            text-rendering: optimizeLegibility
        }

        .tr-c:hover {
            background: rgba(139, 92, 246, .18);
            transform: translateY(-1px)
        }

        /* Quick Tags */
        .qt-row {
            max-width: 700px;
            margin: 7px auto 0;
            display: flex;
            gap: 5px;
            flex-wrap: wrap
        }

        .qt {
            padding: 3px 11px;
            font-size: 10.5px;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 18px;
            color: var(--t2);
            cursor: pointer;
            transition: all .18s;
            font-family: var(--bn);
            text-rendering: optimizeLegibility;
            display: flex;
            align-items: center;
            gap: 4px
        }

        .qt:hover {
            background: var(--g2);
            color: var(--t1);
            border-color: var(--gb2);
            transform: translateY(-1px)
        }

        .qt i {
            font-size: 8px;
            color: var(--t4)
        }

        /* SCROLL */
        .scr {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 20px 28px
        }

        .scr::-webkit-scrollbar {
            width: 5px
        }

        .scr::-webkit-scrollbar-track {
            background: transparent
        }

        .scr::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .06);
            border-radius: 3px
        }

        .scr::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, .12)
        }

        .scr-in {
            max-width: 900px;
            margin: 0 auto
        }

        /* GLASS CARD */
        .gc {
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: var(--radius);
            backdrop-filter: blur(20px) saturate(180%);
            position: relative;
            overflow: hidden;
            transition: all .25s var(--ease)
        }

        .gc::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .06), transparent)
        }

        .gc:hover {
            border-color: var(--gb2)
        }

        /* DASHBOARD */
        .dash {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 14px;
            padding-top: 6px
        }

        .dc {
            padding: 22px;
            cursor: default;
            transition: all .28s var(--ease)
        }

        .dc:hover {
            background: var(--g2);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, .2)
        }

        .dc-hd {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 12px
        }

        .dc-ico {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px
        }

        .dc-ico.pur {
            background: rgba(139, 92, 246, .1);
            border: 1px solid rgba(139, 92, 246, .18);
            color: var(--a1)
        }

        .dc-ico.pnk {
            background: rgba(236, 72, 153, .1);
            border: 1px solid rgba(236, 72, 153, .18);
            color: var(--a2)
        }

        .dc-ico.cyn {
            background: rgba(6, 182, 212, .1);
            border: 1px solid rgba(6, 182, 212, .18);
            color: var(--a3)
        }

        .dc-ico.amb {
            background: rgba(245, 158, 11, .1);
            border: 1px solid rgba(245, 158, 11, .18);
            color: var(--a4)
        }

        .dc-ico.grn {
            background: rgba(34, 197, 94, .1);
            border: 1px solid rgba(34, 197, 94, .18);
            color: var(--a5)
        }

        .dc-title {
            font-size: 13px;
            font-weight: 700
        }

        .dc-sub {
            font-size: 10px;
            color: var(--t4)
        }

        .dc-body {
            font-size: 12px;
            color: var(--t2);
            line-height: 1.65
        }

        .dc-stat {
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--a1), var(--a2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 6px 0 2px
        }

        .dc-stat-lbl {
            font-size: 10px;
            color: var(--t4)
        }

        .wod-bn {
            font-family: var(--bn);
            font-size: 26px;
            font-weight: 700;
            margin: 6px 0 3px;
            color: var(--t1);
            text-rendering: optimizeLegibility
        }

        .wod-en {
            font-size: 15px;
            color: var(--a1);
            font-weight: 600;
            margin-bottom: 4px
        }

        .wod-m {
            font-size: 11px;
            color: var(--t2);
            line-height: 1.6
        }

        .dc-list {
            list-style: none;
            margin-top: 6px
        }

        .dc-list li {
            padding: 5px 0;
            border-bottom: 1px solid var(--gb);
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            color: var(--t2);
            cursor: pointer;
            transition: color .18s
        }

        .dc-list li:last-child {
            border: none
        }

        .dc-list li:hover {
            color: var(--t1)
        }

        .dc-list .lb {
            font-family: var(--bn);
            font-weight: 500;
            color: var(--t1);
            flex: 1;
            text-rendering: optimizeLegibility
        }

        .dc-list .le {
            color: var(--t2);
            flex: 1
        }

        .dc-act {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            margin-top: 8px;
            background: rgba(139, 92, 246, .08);
            border: 1px solid rgba(139, 92, 246, .16);
            border-radius: 7px;
            color: var(--a1);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all .18s
        }

        .dc-act:hover {
            background: rgba(139, 92, 246, .16);
            transform: translateY(-1px)
        }

        .dc-act i {
            font-size: 9px
        }

        /* Num converter */
        .numc {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px
        }

        .numinp {
            flex: 1;
            padding: 8px 12px;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 9px;
            color: var(--t1);
            font-size: 15px;
            font-family: var(--bn);
            outline: none;
            text-align: center;
            transition: border-color .3s;
            text-rendering: optimizeLegibility
        }

        .numinp:focus {
            border-color: rgba(139, 92, 246, .3)
        }

        .numarr {
            font-size: 14px;
            color: var(--a1)
        }

        .numout {
            flex: 1;
            padding: 8px 12px;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 9px;
            color: var(--a1);
            font-size: 15px;
            font-family: var(--bn);
            text-align: center;
            text-rendering: optimizeLegibility;
            font-weight: 600;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center
        }

        /* SECTION HEAD */
        .shd {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 18px 0 10px;
            padding: 0 2px
        }

        .shd-ico {
            font-size: 13px;
            color: var(--a1)
        }

        .shd-t {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: var(--t4)
        }

        .shd-ln {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--gb), transparent)
        }

        /* WORD CARD */
        .wcard {
            padding: 24px
        }

        .wc-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px
        }

        .wc-w {
            font-family: var(--bn);
            font-size: 32px;
            font-weight: 700;
            line-height: 1.3;
            background: linear-gradient(135deg, var(--t1), rgba(255, 255, 255, .6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-rendering: optimizeLegibility
        }

        .wc-acts {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
            margin-top: 3px
        }

        .wc-b {
            width: 34px;
            height: 34px;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 9px;
            color: var(--t2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all .22s
        }

        .wc-b:hover {
            background: var(--g2);
            color: var(--t1);
            transform: scale(1.06)
        }

        .wc-b.bmd {
            color: var(--warn);
            border-color: rgba(251, 191, 36, .22);
            background: rgba(251, 191, 36, .07)
        }

        .wc-dir {
            font-size: 11px;
            color: var(--t3);
            font-weight: 500;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px
        }

        .wc-dir i {
            font-size: 9px
        }

        .pills {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 10px
        }

        .pill {
            padding: 3px 11px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            border-radius: 18px;
            backdrop-filter: blur(8px)
        }

        .pill.pos {
            background: rgba(139, 92, 246, .08);
            border: 1px solid rgba(139, 92, 246, .16);
            color: var(--a1)
        }

        .pill.gen {
            background: rgba(236, 72, 153, .08);
            border: 1px solid rgba(236, 72, 153, .16);
            color: var(--a2)
        }

        /* TRANSLATIONS */
        .tl {
            display: flex;
            flex-direction: column;
            gap: 7px
        }

        .ti {
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 11px;
            cursor: default
        }

        .ti:hover {
            background: var(--g2);
            transform: translateX(3px)
        }

        .tr-pl {
            width: 28px;
            height: 28px;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 7px;
            color: var(--t3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            transition: all .22s;
            margin-top: 2px
        }

        .tr-pl:hover {
            background: rgba(139, 92, 246, .08);
            border-color: rgba(139, 92, 246, .2);
            color: var(--a1);
            transform: scale(1.08)
        }

        .tn {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--a1), var(--a2));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
            margin-top: 1px
        }

        .tc {
            flex: 1;
            min-width: 0
        }

        .tw {
            font-family: var(--bn);
            font-size: 18px;
            font-weight: 600;
            color: var(--t1);
            line-height: 1.4;
            text-rendering: optimizeLegibility
        }

        .tw.enw {
            font-family: var(--en)
        }

        .tm {
            font-size: 11px;
            color: var(--t2);
            margin-top: 2px;
            line-height: 1.5
        }

        .tp {
            display: inline-block;
            padding: 2px 7px;
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 10px;
            background: rgba(52, 211, 153, .08);
            border: 1px solid rgba(52, 211, 153, .16);
            color: var(--ok);
            margin-top: 4px;
            letter-spacing: .4px
        }

        /* MEANINGS */
        .mi {
            padding: 14px 18px;
            position: relative
        }

        .mi::after {
            content: '';
            position: absolute;
            left: 0;
            top: 6px;
            bottom: 6px;
            width: 3px;
            background: linear-gradient(180deg, var(--a1), var(--a2));
            border-radius: 2px
        }

        .mt {
            font-size: 12px;
            line-height: 1.7;
            color: var(--t2);
            padding-left: 14px
        }

        .mt.bnm {
            font-family: var(--bn);
            text-rendering: optimizeLegibility
        }

        /* SENTENCES */
        .sg {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .sp {
            overflow: hidden
        }

        .sr {
            padding: 11px 16px;
            display: flex;
            align-items: flex-start;
            gap: 9px
        }

        .sr+.sr {
            border-top: 1px solid var(--gb)
        }

        .sl {
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .7px;
            padding: 3px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            margin-top: 2px
        }

        .sl.sbn {
            background: rgba(139, 92, 246, .1);
            color: var(--a1)
        }

        .sl.sen {
            background: rgba(236, 72, 153, .1);
            color: var(--a2)
        }

        .st {
            font-size: 12px;
            line-height: 1.7;
            color: var(--t2)
        }

        .st.bnt {
            font-family: var(--bn);
            text-rendering: optimizeLegibility
        }

        .st mark {
            background: rgba(139, 92, 246, .15);
            color: var(--a1);
            border-radius: 3px;
            padding: 0 2px;
            font-weight: 600
        }

        /* SKELETON */
        .sk {
            height: 13px;
            background: linear-gradient(90deg, rgba(255, 255, 255, .02) 25%, rgba(255, 255, 255, .05) 50%, rgba(255, 255, 255, .02) 75%);
            background-size: 200% 100%;
            animation: shim 1.5s infinite;
            border-radius: 6px;
            margin-bottom: 7px
        }

        .sk.h26 {
            height: 26px
        }

        .sk.h18 {
            height: 18px
        }

        .sk.w90 {
            width: 90%
        }

        .sk.w80 {
            width: 80%
        }

        .sk.w60 {
            width: 60%
        }

        .sk.w40 {
            width: 40%
        }

        .sk.w30 {
            width: 30%
        }

        .skp {
            display: flex;
            gap: 5px;
            margin: 8px 0
        }

        .skpl {
            width: 60px;
            height: 22px;
            border-radius: 11px;
            background: linear-gradient(90deg, rgba(255, 255, 255, .02) 25%, rgba(255, 255, 255, .05) 50%, rgba(255, 255, 255, .02) 75%);
            background-size: 200% 100%;
            animation: shim 1.5s infinite
        }

        @keyframes shim {
            0% {
                background-position: 200% 0
            }

            100% {
                background-position: -200% 0
            }
        }

        /* STATE */
        .state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 44px 20px;
            text-align: center;
            animation: fi .5s
        }

        .state-ico {
            font-size: 44px;
            margin-bottom: 14px;
            color: var(--t4)
        }

        .state-t {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 5px
        }

        .state-d {
            font-size: 12px;
            color: var(--t2);
            max-width: 360px;
            line-height: 1.65
        }

        /* TOAST */
        .toast-w {
            position: fixed;
            top: 74px;
            right: 18px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none
        }

        .toast {
            padding: 10px 16px;
            background: rgba(14, 14, 24, .92);
            border: 1px solid var(--gb2);
            border-radius: 11px;
            backdrop-filter: blur(20px);
            color: var(--t1);
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 7px;
            animation: tIn .35s var(--spring);
            pointer-events: auto;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .35)
        }

        .toast.out {
            animation: tOut .25s var(--ease) forwards
        }

        .toast i {
            font-size: 13px
        }

        @keyframes tIn {
            from {
                opacity: 0;
                transform: translateX(36px) scale(.92)
            }

            to {
                opacity: 1;
                transform: translateX(0) scale(1)
            }
        }

        @keyframes tOut {
            to {
                opacity: 0;
                transform: translateX(36px) scale(.92)
            }
        }

        /* MODAL */
        .mo {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, .55);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            transition: all .28s
        }

        .mo.open {
            opacity: 1;
            visibility: visible
        }

        .modal {
            background: rgba(14, 14, 24, .94);
            border: 1px solid var(--gb2);
            border-radius: 18px;
            backdrop-filter: blur(30px);
            max-width: 560px;
            width: 100%;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            transform: scale(.93) translateY(8px);
            transition: transform .32s var(--spring);
            overflow: hidden;
            box-shadow: 0 24px 72px rgba(0, 0, 0, .45)
        }

        .mo.open .modal {
            transform: scale(1) translateY(0)
        }

        .m-hd {
            padding: 18px 22px;
            border-bottom: 1px solid var(--gb);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0
        }

        .m-title {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .m-title i {
            color: var(--a1);
            font-size: 14px
        }

        .m-x {
            width: 30px;
            height: 30px;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 8px;
            color: var(--t3);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .18s
        }

        .m-x:hover {
            background: var(--g2);
            color: var(--t1)
        }

        .m-body {
            flex: 1;
            overflow-y: auto;
            padding: 18px 22px
        }

        .m-body::-webkit-scrollbar {
            width: 3px
        }

        .m-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .06);
            border-radius: 2px
        }

        .m-ft {
            padding: 14px 22px;
            border-top: 1px solid var(--gb);
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            flex-shrink: 0
        }

        .mbtn {
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all .18s;
            font-family: var(--en);
            display: flex;
            align-items: center;
            gap: 5px
        }

        .mbtn i {
            font-size: 10px
        }

        .mbtn.pri {
            background: linear-gradient(135deg, var(--a1), var(--a2));
            border: none;
            color: #fff
        }

        .mbtn.pri:hover {
            box-shadow: 0 3px 14px var(--ag1);
            transform: translateY(-1px)
        }

        .mbtn.gho {
            background: var(--g1);
            border: 1px solid var(--gb);
            color: var(--t2)
        }

        .mbtn.gho:hover {
            background: var(--g2);
            color: var(--t1)
        }

        /* Phrasebook */
        .ph-cat {
            margin-bottom: 14px
        }

        .ph-cat-t {
            font-size: 11px;
            font-weight: 700;
            color: var(--a1);
            text-transform: uppercase;
            letter-spacing: .8px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 2px
        }

        .ph-item {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 7px;
            transition: background .18s;
            cursor: pointer
        }

        .ph-item:hover {
            background: var(--g1)
        }

        .ph-bn {
            font-family: var(--bn);
            font-size: 13px;
            font-weight: 500;
            color: var(--t1);
            flex: 1;
            text-rendering: optimizeLegibility
        }

        .ph-en {
            font-size: 11px;
            color: var(--t2);
            flex: 1
        }

        .ph-copy {
            font-size: 10px;
            color: var(--t4);
            opacity: 0;
            transition: opacity .18s;
            cursor: pointer;
            flex-shrink: 0
        }

        .ph-item:hover .ph-copy {
            opacity: 1
        }

        .ph-copy:hover {
            color: var(--a1)
        }

        /* Alphabet */
        .alp-sec {
            margin-bottom: 16px
        }

        .alp-sec-t {
            font-size: 10px;
            font-weight: 700;
            color: var(--a2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px
        }

        .alp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
            gap: 5px
        }

        .alp-c {
            padding: 8px 3px;
            text-align: center;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 9px;
            cursor: pointer;
            transition: all .18s
        }

        .alp-c:hover {
            background: var(--g2);
            transform: scale(1.06);
            border-color: rgba(139, 92, 246, .25)
        }

        .alp-bn {
            font-family: var(--bn);
            font-size: 18px;
            font-weight: 600;
            color: var(--t1);
            display: block;
            text-rendering: optimizeLegibility
        }

        .alp-rm {
            font-size: 8px;
            color: var(--t4);
            margin-top: 1px
        }

        /* Flashcard */
        .fl-w {
            max-width: 360px;
            width: 100%;
            margin: 0 auto;
            perspective: 1000px
        }

        .fl-inner {
            position: relative;
            width: 100%;
            min-height: 240px;
            transition: transform .55s;
            transform-style: preserve-3d
        }

        .fl-inner.flip {
            transform: rotateY(180deg)
        }

        .fl-f,
        .fl-b {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 18px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center
        }

        .fl-f {
            background: linear-gradient(135deg, rgba(139, 92, 246, .1), rgba(236, 72, 153, .06));
            border: 1px solid rgba(139, 92, 246, .18)
        }

        .fl-b {
            background: linear-gradient(135deg, rgba(52, 211, 153, .1), rgba(6, 182, 212, .06));
            border: 1px solid rgba(52, 211, 153, .18);
            transform: rotateY(180deg)
        }

        .fl-word {
            font-family: var(--bn);
            font-size: 30px;
            font-weight: 700;
            color: var(--t1);
            text-rendering: optimizeLegibility
        }

        .fl-hint {
            font-size: 11px;
            color: var(--t4);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 4px
        }

        .fl-hint i {
            font-size: 9px
        }

        .fl-ans {
            font-family: var(--bn);
            font-size: 26px;
            font-weight: 600;
            color: var(--ok);
            text-rendering: optimizeLegibility
        }

        .fl-note {
            font-size: 11px;
            color: var(--t2);
            margin-top: 7px;
            font-style: italic
        }

        .fl-ctrls {
            display: flex;
            gap: 7px;
            justify-content: center;
            margin-top: 18px
        }

        .fl-btn {
            padding: 7px 16px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all .18s;
            font-family: var(--en);
            display: flex;
            align-items: center;
            gap: 5px
        }

        .fl-btn i {
            font-size: 10px
        }

        .fl-btn.flip-b {
            background: rgba(139, 92, 246, .1);
            border: 1px solid rgba(139, 92, 246, .18);
            color: var(--a1)
        }

        .fl-btn.flip-b:hover {
            background: rgba(139, 92, 246, .18)
        }

        .fl-btn.prev-b {
            background: var(--g1);
            border: 1px solid var(--gb);
            color: var(--t2)
        }

        .fl-btn.prev-b:hover {
            background: var(--g2);
            color: var(--t1)
        }

        .fl-btn.next-b {
            background: rgba(52, 211, 153, .1);
            border: 1px solid rgba(52, 211, 153, .18);
            color: var(--ok)
        }

        .fl-btn.next-b:hover {
            background: rgba(52, 211, 153, .18)
        }

        .fl-counter {
            text-align: center;
            font-size: 10px;
            color: var(--t4);
            margin-top: 10px
        }

        /* Note Input */
        .note-ta {
            width: 100%;
            padding: 9px 12px;
            background: var(--g1);
            border: 1px solid var(--gb);
            border-radius: 9px;
            color: var(--t1);
            font-size: 12px;
            font-family: var(--en);
            resize: vertical;
            min-height: 55px;
            outline: none;
            transition: border-color .3s;
            margin-top: 6px
        }

        .note-ta:focus {
            border-color: rgba(139, 92, 246, .3)
        }

        .note-ta::placeholder {
            color: var(--t4)
        }

        .form-lbl {
            font-size: 10px;
            font-weight: 600;
            color: var(--t2);
            text-transform: uppercase;
            letter-spacing: .4px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 4px
        }

        .form-lbl i {
            font-size: 9px
        }

        /* ANIM */
        @keyframes fi {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @keyframes su {
            from {
                opacity: 0;
                transform: translateY(22px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .au {
            animation: su .45s var(--spring) both
        }

        .au1 {
            animation-delay: 0ms
        }

        .au2 {
            animation-delay: 65ms
        }

        .au3 {
            animation-delay: 130ms
        }

        .au4 {
            animation-delay: 195ms
        }

        .au5 {
            animation-delay: 260ms
        }

        .au6 {
            animation-delay: 325ms
        }

        /* RESPONSIVE */
        @media(max-width:768px) {
            :root {
                --sbw: 100%
            }

            .hdr {
                padding: 0 12px;
                height: 54px
            }

            .logo-en {
                display: none
            }

            .bn-date {
                display: none
            }

            .srch-area {
                padding: 12px 12px 6px
            }

            .sinput {
                font-size: 13.5px;
                padding: 12px 9px
            }

            .go-b {
                padding: 8px 13px;
                font-size: 11.5px
            }

            .go-b span {
                display: none
            }

            .scr {
                padding: 0 12px 20px
            }

            .dash {
                grid-template-columns: 1fr
            }

            .sb.open {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 25
            }

            .wc-w {
                font-size: 26px
            }

            .wcard {
                padding: 18px
            }

            .modal {
                max-width: 100%;
                border-radius: 14px;
                max-height: 90vh
            }
        }

        @media(min-width:1440px) {
            .scr-in {
                max-width: 1000px
            }

            .srch-wrap {
                max-width: 780px
            }
        }
    </style>
</head>

<body>

                                autocomplete="off" spellcheck="false">
                            <button class="dir-b" id="dirB"><i class="fa-solid fa-arrow-right-arrow-left"></i> <span
                                    id="dirTxt">EN→BN</span></button>

                                <span>Search</span></button>
